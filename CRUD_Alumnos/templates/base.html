<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro de alumnos V2 </title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='bootstrap/css/bootstrap.min.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='estilos.css') }}">
</head>

<body>

<nav class="navbar navbar-expand-lg bg-dark"
     data-bs-theme="dark"
     aria-label="Menú principal">

    <div class="container">

        <a class="navbar-brand" href="{{ url_for('inicio') }}">
                OCP INDUSTRIES
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menuPrincipal"
                aria-controls="menuPrincipal"
                aria-expanded="false"
                aria-label="Abrir o cerrar menú">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="menuPrincipal">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link"
                       href="{{ url_for('inicio') }}">
                        Inicio
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                href="{{ url_for('registrar') }}">
                Registrar
                </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                href="{{ url_for('lista') }}">
                Lista de alumnos
                </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="{{ url_for('ayuda') }}">
                        Ayuda
                    </a>
                </li>
                <li class="nav-item ms-lg-2">
                <button id="btnTema"
            class="btn btn-outline-light"
            type="button">
                 🌙
                </button>
                </li>
            </ul>

        </div>

    </div>

</nav><main class="container py-4">

    <header class="mb-4">
        <p class="text-uppercase text-secondary small mb-1">
            Aplicaciones Web · Práctica 03
        </p>

        <h1 class="h2">Registro de alumnos</h1>

        <p class="text-secondary">
            Consulta y organiza los datos del grupo.
        </p>
    </header>

    {% block contenido %}{% endblock %}

</main>

<footer class="container py-3 border-top text-secondary small">
    Laboratorio de Aplicaciones Web · Datos de práctica
</footer>

<script src="{{ url_for('static',
              filename='bootstrap/js/bootstrap.bundle.min.js') }}"></script>
              <script>
    const btnTema = document.getElementById("btnTema");

    btnTema.addEventListener("click", function () {
        const html = document.documentElement;
        const temaActual = html.getAttribute("data-bs-theme");

        if (temaActual === "dark") {
            html.setAttribute("data-bs-theme", "light");
            btnTema.textContent = "🌙";
            localStorage.setItem("tema", "light");
        } else {
            html.setAttribute("data-bs-theme", "dark");
            btnTema.textContent = "☀️";
            localStorage.setItem("tema", "dark");
        }
    });

    const temaGuardado = localStorage.getItem("tema");

    if (temaGuardado === "dark") {
        document.documentElement.setAttribute("data-bs-theme", "dark");
        btnTema.textContent = "☀️";
    }

</script>

</body>
</html>
