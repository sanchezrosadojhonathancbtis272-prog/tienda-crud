{% extends 'base.html' %}{% block titulo %}Crear cuenta | Tienda CRUD{% endblock %}{% block contenido %}
<div class="row justify-content-center"><div class="col-md-6"><div class="card shadow-sm rounded-4"><div class="card-body p-4"><h2 class="h4 fw-bold mb-3">👤 Crear cuenta</h2><form method="post"><input type="hidden" name="_csrf" value="{{ csrf_token }}"><label class="form-label">Nombre</label><input class="form-control mb-3" name="nombre" minlength="2" maxlength="80" required><label class="form-label">Correo electrónico</label><input class="form-control mb-3" name="correo" type="email" required><label class="form-label">Contraseña (mínimo 8 caracteres)</label><input class="form-control mb-3" name="clave" type="password" minlength="8" required><button class="btn btn-primary w-100">Crear cuenta</button></form><p class="mt-3 mb-0">¿Ya tienes cuenta? <a href="{{ url_for('login') }}">Inicia sesión</a></p></div></div></div></div>{% endblock %}
